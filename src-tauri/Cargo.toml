[package]
name = "open-hippo-campus"
version = "0.1.0"
description = "Gestor local de servicios en contenedores (PoC)"
edition = "2024"

[lib]
# Nombre distinto al binario para evitar choques en Windows.
name = "open_hippo_campus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bollard = "0.21.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
